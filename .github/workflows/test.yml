# The set's checks: the gate's selftests, the repo rules and the set's own
# tests, the kinds registry's conformance among them. Nothing here checks out
# or runs another repository: the registry is validated against the set's own
# copy of the product-repository contract's published schema.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
