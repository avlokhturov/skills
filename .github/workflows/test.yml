# The set's checks: the gate's selftests, the repo rules, the set's own
# tests and the navigation registry's live lane — the registry the set
# writes, read under the set's own reader. No repository depends on
# another: nothing here checks out or runs another repository, and the
# product-repository contract's shape is validated by the set's own code
# against the set's own copy of the published schema. Where that copy is
# on the branch, its check runs in this workflow; where it is not yet,
# the conformance run skips with that named — a skip is never a pass.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
