# The set's checks: the gate's selftests, the repo rules, the set's own
# tests and — where the product-repository contract stands — the two
# contract lanes of test/kinds-conformance.test.mjs. The engine is checked
# out at the pin the protocol records beside the setup version; the pin
# moves only as a deliberate change there. The conformance run must refuse
# to pass an unchecked registry: in CI the skip is a failure, so a refusal
# from the engine's check fails the run.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: shady2k/madarch
          ref: 853c8646f4a253c175b9cb5f4620eb771d4be56b
          path: madarch
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install
        working-directory: madarch
      - run: npm test
        env:
          MADARCH: ${{ github.workspace }}/madarch
